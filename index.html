<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一般常識クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>一般常識クイズ</h1>
      <p id="progress" class="progress"></p>
    </header>

    <main>
      <section id="quiz-screen">
        <p id="question-text" class="question-text"></p>
        <div id="choices" class="choices"></div>
        <p id="feedback" class="feedback"></p>
        <button id="next-btn" class="btn" disabled>次へ</button>
      </section>

      <section id="result-screen" class="hidden">
        <h2>結果発表</h2>
        <p id="score-text" class="score-text"></p>
        <button id="restart-btn" class="btn">もう一度挑戦する</button>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
